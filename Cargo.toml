[package]
name = "safeshare-server"
version = "0.1.0"
edition = "2024"

[dependencies]
qrcode-rust = "0.1.3"
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
response = { version = "1.0.2" }
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
tower-http = { version = "0.7.0", features = ["fs"] }
sha2 = "0.11.0"
hmac = "0.13.0"
rand = "0.10.2"
base64 = "0.22.1"
serde_json = "1.0.150"
dotenvy = "0.15.7"
